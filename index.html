<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code2Work Sayfası</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header">
        <div class="logo">
            <h1>Code2Work</h1>
        </div>

        <nav id="menu">
            <a href="#hero">Ana Sayfa</a>
            <a href="#gallery">Galeri</a>
            <a href="#footer">İletişim</a>
        </nav>

    <main>
        <section id="hero">
            <h2>Geleceğin Yazılımcısı Olun</h2>
            <p>Code2Work ile modern web teknolojilerini öğrenin.</p>
        </section>

        <section id="gallery">
            <div class="gallery-item">
                <img src="images/item1.jpg" alt="Görsel 1">
                <h3>Başlık 1</h3>
            </div>
            <div class="gallery-item">
                <img src="images/item2.jpg" alt="Görsel 2">
                <h3>Başlık 2</h3>
            </div>
            <div class="gallery-item">
                <img src="images/item3.jpg" alt="Görsel 3">
                <h3>Başlık 3</h3>
            </div>
        </section>
    </main>

    <footer id="footer">
        <p>&copy; 2026 Code2Work</p>
        <a href="#header"><button type="button">Başa dön</button></a>
    </footer>

</body>

</html>
